{% extends "base.html" %}
{% block title %}Login • CampusHub{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">CampusHub</div>
    <h1>Welcome back</h1>
    <p class="text-secondary">Sign in to manage your campus bookings.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-dark w-100 py-2">Sign in</button>
    </form>
    <p class="small text-center mt-3 mb-0">No account? <a href="{% url 'register' %}">Create one</a></p>
  </div>
</div>
{% endblock %}
